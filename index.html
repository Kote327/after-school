<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="グループの予定を確認・共有するためのシンプルな予定表">
  <title>つどい | グループ予定表</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="つどい ホーム">
        <span class="brand-mark">tsu</span>
        <span class="brand-name">つどい</span>
      </a>
      <div class="topbar-actions">
        <span class="sync-status" id="syncStatus"><span class="status-dot"></span>このブラウザーに保存</span>
        <button class="avatar" type="button" aria-label="プロフィール">KN</button>
      </div>
    </header>

    <main class="main-content">
      <section class="welcome-row" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">GROUP SCHEDULE</p>
          <label class="group-picker-label" for="groupSelect">表示するグループ</label>
          <div class="group-controls">
            <select id="groupSelect" aria-label="表示するグループ"></select>
            <button class="text-button" id="createGroup" type="button">＋ グループ作成</button>
          </div>
          <h1 id="page-title"><span id="activeGroupName">みんな</span>の予定<span class="title-dot">.</span></h1>
          <p class="date-line" id="todayLabel"></p>
        </div>
        <button class="primary-button" id="openModal" type="button"><span>＋</span>予定を追加</button>
      </section>

      <section class="summary-strip" aria-label="予定の概要">
        <div class="summary-item"><span class="summary-number" id="todayCount">3</span><span>今日の予定</span></div>
        <div class="summary-divider"></div>
        <div class="summary-item"><span class="summary-number accent-number" id="memberCount">5</span><span>参加メンバー</span></div>
        <div class="summary-divider"></div>
        <div class="summary-item next-summary"><span class="summary-label">次の予定</span><strong id="nextEvent">デザイン定例</strong><span id="nextTime">14:00</span></div>
      </section>

      <div class="content-grid">
        <section class="schedule-panel" aria-labelledby="schedule-heading">
          <div class="section-heading">
            <div>
              <p class="section-kicker">SCHEDULE</p>
              <h2 id="schedule-heading">今週の予定</h2>
            </div>
            <div class="view-switcher" role="group" aria-label="表示切替">
              <button class="view-button active" data-view="agenda" type="button">リスト</button>
              <button class="view-button" data-view="week" type="button">週</button>
            </div>
          </div>
          <div class="filter-row">
            <label class="search-box"><span aria-hidden="true">⌕</span><input id="searchInput" type="search" placeholder="予定を検索" aria-label="予定を検索"></label>
            <select id="categoryFilter" aria-label="カテゴリーで絞り込み">
              <option value="all">すべて</option>
              <option value="work">仕事</option>
              <option value="personal">個人</option>
              <option value="event">イベント</option>
            </select>
          </div>
          <div id="agendaView" class="agenda-list"></div>
          <div id="weekView" class="week-view" hidden></div>
        </section>

        <aside class="side-column">
          <section class="members-panel" aria-labelledby="members-heading">
            <div class="section-heading compact-heading">
              <div><p class="section-kicker">PEOPLE</p><h2 id="members-heading">参加メンバー</h2></div>
              <button class="icon-button" id="addMember" type="button" aria-label="メンバーを追加" title="メンバーを追加">＋</button>
            </div>
            <div class="member-list" id="memberList"></div>
          </section>
          <section class="availability-panel" aria-labelledby="availability-heading">
            <div class="section-heading compact-heading">
              <div><p class="section-kicker">OPEN DAYS</p><h2 id="availability-heading">空いている日</h2></div>
              <span class="availability-range">7日間</span>
            </div>
            <div id="availabilityList" class="availability-list"></div>
          </section>
          <section class="note-panel">
            <span class="note-icon">✦</span>
            <div><strong>グループの使い方</strong><p>メンバーと予定を追加して<br>グループごとに整理できます。</p></div>
          </section>
        </aside>
      </div>
    </main>
  </div>

  <dialog id="eventModal" class="event-modal">
    <form id="eventForm" method="dialog">
      <div class="modal-header"><div><p class="section-kicker">NEW EVENT</p><h2>予定を追加</h2></div><button class="close-button" id="closeModal" type="button" aria-label="閉じる">×</button></div>
      <label>予定の名前<input name="title" required placeholder="例：チームミーティング"></label>
      <div class="form-row"><label>日付<input name="date" type="date" required></label><label>時間<input name="time" type="time" required value="10:00"></label></div>
      <label>カテゴリー<select name="category"><option value="work">仕事</option><option value="personal">個人</option><option value="event">イベント</option></select></label>
      <label>参加者<input name="attendees" placeholder="例：加奈、ゆうた"></label>
      <button class="primary-button full-button" type="submit">予定を保存</button>
    </form>
  </dialog>
  <dialog id="groupModal" class="event-modal">
    <form id="groupForm">
      <div class="modal-header"><div><p class="section-kicker">NEW GROUP</p><h2>グループを作成</h2></div><button class="close-button" type="button" data-close-dialog="groupModal" aria-label="閉じる">×</button></div>
      <label>グループ名<input name="name" required maxlength="40" placeholder="例：放課後クラブ"></label>
      <p class="form-hint">作成したグループは、このブラウザー内に保存されます。</p>
      <button class="primary-button full-button" type="submit">グループを作成</button>
    </form>
  </dialog>
  <dialog id="memberModal" class="event-modal">
    <form id="memberForm">
      <div class="modal-header"><div><p class="section-kicker">ADD MEMBER</p><h2>メンバーを追加</h2></div><button class="close-button" type="button" data-close-dialog="memberModal" aria-label="閉じる">×</button></div>
      <label>名前<input name="name" required maxlength="30" placeholder="例：ゆうた"></label>
      <label>表示用のイニシャル<input name="initials" maxlength="3" placeholder="例：YT"></label>
      <p class="form-hint">メンバー情報は現在選択中のグループに保存されます。</p>
      <button class="primary-button full-button" type="submit">メンバーを追加</button>
    </form>
  </dialog>
  <script src="script.js"></script>
</body>
</html>
